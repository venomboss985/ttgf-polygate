# Tiny Tapeout project information
project:
  title:        "Polygate"      # Project title
  author:       "Venom"      # Your name
  discord:      "@venomboss985"      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "A configurable 4-channel logic gate IC"      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     0       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 340x160 uM.
  tiles: "1x1"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 3x4 or 4x4

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_polygate"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "CH0_A"  # Channel 0 input A
  ui[1]: "CH0_B"  # Channel 0 input B
  ui[2]: "CH1_A"  # Channel 1 input A
  ui[3]: "CH1_B"  # Channel 1 input B
  ui[4]: "CH2_A"  # Channel 2 input A
  ui[5]: "CH2_B"  # Channel 2 input B
  ui[6]: "CH3_A"  # Channel 3 input A
  ui[7]: "CH3_B"  # Channel 3 input B

  # Outputs
  uo[0]: "CH0_C"  # Channel 0 non-inverted output
  uo[1]: "CH0_NC" # Channel 0 inverted output
  uo[2]: "CH1_C"  # Channel 1 non-inverted output
  uo[3]: "CH1_NC" # Channel 1 inverted output
  uo[4]: "CH2_C"  # Channel 2 non-inverted output
  uo[5]: "CH2_NC" # Channel 2 inverted output
  uo[6]: "CH3_C"  # Channel 3 non-inverted output
  uo[7]: "CH3_NC" # Channel 3 inverted output

  # Bidirectional pins
  uio[0]: "CH0_CTRL"  # Channel 0 control pin
  uio[1]: "CH1_CTRL"  # Channel 1 control pin
  uio[2]: "CH2_CTRL"  # Channel 2 control pin
  uio[3]: "CH3_CTRL"  # Channel 3 control pin
  uio[4]: "CH0_OE"    # Channel 0 output enable
  uio[5]: "CH1_OE"    # Channel 1 output enable
  uio[6]: "CH2_OE"    # Channel 2 output enable
  uio[7]: "CH3_OE"    # Channel 3 output enable

# Do not change!
yaml_version: 6
